<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Subsequent Sibling*/
        div ~ p{
            color: blueviolet;
        }
        /*Next or Immediate Sibling*/
        div + p{
            color: red;
        }
        /*Child*/
        div > p{
            color: crimson;
        }
        /*Descendant*/
        div p{
            color: blue;
        }

    </style>
</head>
<body>
    <div>
        Test
        
        
    </div>
    <p>
        Test 1
    </p>
    <p>
        Test 2
    </p>
</body>
</html>
